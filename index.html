<title>Защити микропета от ковтопа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Lobster&family=Rubik:wght@400;500;600;700;800;900&display=swap">
<style>
/* Отель после закрытия: латунные таблички номеров, выцветший обой, мятный свет микропета.
   Вертикальный кадр 9:16 по центру; сверху HUD, по центру 3D-сцена, снизу док. */
:root {
  --ink: #0b0a09; --panel: #15120e; --panel2: #1e1913; --line: #3a3024;
  --brass: #c9a35a; --brass-hi: #ecd18f; --pet: #5fffd8; --blood: #e0445a;
  --text: #efe6d2; --mute: #9b8f7a; --good: #7ee08a; --warn: #ffb347;
  --f-display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --f-body: 'Manrope', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
  --r: 0.5em;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: #050404; color: var(--text); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--pet); outline-offset: 2px; }

#app { position: relative; height: 100%; display: grid; place-items: center; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.frame {
  position: relative; overflow: hidden;
  width: min(100%, calc((100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 9 / 16));
  height: min(100%, calc(100vw * 16 / 9));
  aspect-ratio: 9 / 16;
  background: var(--ink);
  font-size: var(--fs, 15px);
  display: flex; flex-direction: column;
  box-shadow: 0 0 0 1px #221c15, 0 30px 80px #000;
}
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.scroll { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; padding: 0.9em 1em 1.4em; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

/* Таблички и кнопки */
.btn {
  appearance: none; border: 1px solid var(--line); background: linear-gradient(#251f17, #19150f);
  border-radius: var(--r); padding: 0.75em 1em; min-height: 2.9em; cursor: pointer;
  font-weight: 700; letter-spacing: 0.01em; display: inline-flex; align-items: center; justify-content: center; gap: 0.5em;
  transition: border-color .15s, transform .08s, box-shadow .15s, background .15s;
}
.btn:hover { border-color: var(--brass); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.brass { background: linear-gradient(#e2c27a, #b48a3f); color: #1a1208; border-color: #f2dc9f; box-shadow: inset 0 1px 0 #fff3c8, 0 0 0 1px #6a4f22; }
.btn.brass:hover { box-shadow: inset 0 1px 0 #fff3c8, 0 0 18px #c9a35a66; }
.btn.pet { background: linear-gradient(#2b4a43, #18302b); border-color: #3e8f7c; color: #d9fff4; }
.btn.danger { border-color: #6e2a33; color: #ffb7c0; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 2.3em; padding: 0.4em 0.7em; font-size: 0.86em; }
.btn.block { width: 100%; }
.skip-top { min-height: 2.6em; padding: 0 0.7em; white-space: nowrap; flex: none; }
.bossbar { position: absolute; left: 0.8em; right: 0.8em; top: 0.5em; z-index: 2; padding: 0.35em 0.6em 0.45em; border-radius: 0.5em; background: #12080acc; border: 1px solid #6a1a24; pointer-events: none; }
.bossbar .bb-row { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6em; font-size: 0.82em; color: #ffd0d6; }
.bossbar .bb-row .eta { flex: 1; color: #ffb0b8; font-size: 0.92em; }
.bossbar .bb-row .num { font-family: var(--f-mono); font-weight: 700; color: #fff; }
.bossbar .bar { height: 0.42em; margin-top: 0.25em; border-radius: 99px; background: #2a0d12; overflow: hidden; }
.bossbar .bar i { display: block; height: 100%; background: #ff2a3d; transition: width .12s linear; }
.bossbar.rage { border-color: #ff2a3d; box-shadow: 0 0 0.8em #ff2a3d66; }
.icon-btn { width: 2.6em; height: 2.6em; min-height: 0; padding: 0; }

.plaque { font-family: var(--f-mono); font-weight: 700; background: linear-gradient(#d9b86c, #a8823c); color: #1c1309; border-radius: 0.3em; padding: 0.15em 0.5em; box-shadow: inset 0 1px 0 #fff0c0, 0 1px 0 #00000080; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.72em; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
.h1 { font-family: var(--f-display); font-weight: 900; line-height: 1.02; text-wrap: balance; margin: 0; }
.h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.15em; margin: 0; text-wrap: balance; }
.mute { color: var(--mute); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.coin::before { content: ''; display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff1b0, #ffc53d 45%, #b97a00); margin-right: 0.3em; vertical-align: -0.05em; box-shadow: 0 0 0 1px #6a4500; }
.mcoin::before { background: radial-gradient(circle at 35% 35%, #f0fff9, #5fffd8 45%, #1d8f74); box-shadow: 0 0 0 1px #0d4a3c; }

.topbar { display: flex; align-items: center; gap: 0.6em; padding: 0.7em 1em; border-bottom: 1px solid var(--line); background: linear-gradient(#17130f, #110e0b); }
.topbar .h2 { flex: 1; min-width: 0; }
.section { display: flex; flex-direction: column; gap: 0.55em; margin-top: 1.1em; }
.section:first-child { margin-top: 0; }
.card { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 0.75em 0.85em; }
.list { display: flex; flex-direction: column; gap: 0.45em; }
.row { display: flex; align-items: center; gap: 0.6em; min-width: 0; }
.row > .grow, .grow { flex: 1; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4em; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 0.25em 0.7em; font-size: 0.85em; background: var(--panel2); cursor: pointer; display: inline-flex; align-items: center; gap: 0.35em; }
.chip.on { border-color: var(--pet); color: var(--pet); background: #12302a; }
.tag { font-size: 0.7em; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.15em 0.5em; border-radius: 0.3em; border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
.tag.demo { border-color: #7a5c2a; color: var(--brass-hi); background: #2a2013; }
.tag.lock { border-color: #5a2a33; color: #ff9aa8; }
.note { font-size: 0.82em; color: var(--mute); line-height: 1.45; }
.banner { border: 1px dashed #7a5c2a; background: #1f180f; color: var(--brass-hi); border-radius: var(--r); padding: 0.6em 0.8em; font-size: 0.82em; line-height: 1.45; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 0.55em 0.3em; cursor: pointer; font-weight: 700; font-size: 0.88em; color: var(--mute); }
.seg button.on { background: #2a2216; color: var(--brass-hi); }
.bar { height: 0.45em; border-radius: 1em; background: #2a241c; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--pet), #b7fff0); border-radius: inherit; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: 0.6em 0; border-bottom: 1px solid #241e17; }
.switch { width: 3em; height: 1.7em; border-radius: 1em; background: #2a241c; border: 1px solid var(--line); position: relative; cursor: pointer; flex: none; }
.switch::after { content: ''; position: absolute; top: 0.15em; left: 0.15em; width: 1.3em; height: 1.3em; border-radius: 50%; background: var(--mute); transition: left .15s, background .15s; }
.switch[aria-checked="true"] { background: #17392f; border-color: #3e8f7c; }
.switch[aria-checked="true"]::after { left: 1.5em; background: var(--pet); }
input[type=text] { width: 100%; min-width: 0; background: #0f0d0a; border: 1px solid var(--line); color: var(--text); border-radius: var(--r); padding: 0.65em 0.75em; font: inherit; }
.err { color: #ff9aa8; font-size: 0.82em; min-height: 1.2em; }

/* Главное меню */
.menu-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  background:
    radial-gradient(60% 35% at 50% 8%, #ffcf8a22, transparent 70%),
    radial-gradient(40% 25% at 50% 92%, #5fffd81a, transparent 70%),
    repeating-linear-gradient(90deg, #15201a 0 3.2em, #121a15 3.2em 6.4em);
}

.door { position: absolute; left: 50%; top: 31%; width: 34%; aspect-ratio: 0.52; transform: translateX(-50%); background: linear-gradient(#2c1a10, #1b0f08); border: 0.35em solid #120a05; border-radius: 0.3em 0.3em 0 0; box-shadow: 0 0 60px #ff2a3d22 inset, 0 0 0 0.25em #3a2214; }
.door::before { content: '0000'; position: absolute; top: 9%; left: 50%; transform: translateX(-50%); font-family: var(--f-mono); font-weight: 700; font-size: 0.9em; background: linear-gradient(#d9b86c, #a8823c); color: #1c1309; padding: 0.1em 0.5em; border-radius: 0.2em; }
.door::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4%; background: #ff2a3d; filter: blur(6px); opacity: .55; animation: underdoor 4s infinite; }
@keyframes underdoor { 0%, 100% { opacity: .35 } 45% { opacity: .7 } 50% { opacity: .1 } 55% { opacity: .6 } }
.lamp { position: absolute; top: 0; left: 50%; width: 0.3em; height: 12%; background: #1a140e; transform: translateX(-50%); }
.lamp::after { content: ''; position: absolute; bottom: -0.6em; left: 50%; transform: translateX(-50%); width: 1.2em; height: 1.2em; border-radius: 50%; background: #ffd28a; box-shadow: 0 0 40px 16px #ffb05a55; animation: flicker 5s infinite; }
@keyframes flicker { 0%, 100% { opacity: 1 } 92% { opacity: 1 } 93% { opacity: .2 } 94% { opacity: 1 } 96% { opacity: .4 } 97% { opacity: 1 } }
.peek { position: absolute; top: 46%; left: 10%; width: 3.4em; height: 2.6em; border-radius: 50% 50% 40% 40%; background: radial-gradient(circle at 50% 30%, #c8fff0, #5fffd8 60%, #2fb093); box-shadow: 0 0 30px #5fffd855; animation: bob 2.6s ease-in-out infinite; }
.peek::before, .peek::after { content: ''; position: absolute; top: 38%; width: 0.45em; height: 0.55em; border-radius: 50%; background: #0a0d12; box-shadow: inset 0.1em -0.1em 0 #ffffffaa; }
.peek::before { left: 30%; } .peek::after { right: 30%; }
@keyframes bob { 50% { transform: translateY(-0.3em) } }
.menu-top { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 0.9em 1em 0; gap: 0.6em; }
/* как на макете: крупное кольцо уровня и золотая «пилюля» с монетами */
.menu-top .profile-chip .lvl { width: 2.9em; height: 2.9em; font-size: 1.3em; }
.menu-top .profile-chip { background: #0d0907b3; }
.menu-top .plaque.coin { font-family: var(--f-body); font-weight: 800; font-size: 1.15em; padding: 0.3em 0.8em 0.3em 0.45em; border-radius: 999px; background: linear-gradient(#3a2a12, #20160a); color: #ffe6a8; border: 2px solid #c9a35a; box-shadow: 0 0 14px #c9a35a55, inset 0 1px 0 #ffffff22; letter-spacing: 0.02em; }
.profile-chip { display: flex; align-items: center; gap: 0; background: #120f0bcc; border: 1px solid var(--line); border-radius: 999px; padding: 0.3em; cursor: pointer; min-width: 0; transition: padding .25s; }
.profile-chip .lvl { position: relative; }
.lvl-ok { position: absolute; right: -0.25em; bottom: -0.2em; width: 1.05em; height: 1.05em; border-radius: 50%; display: grid; place-items: center; border: 2px solid #120f0b; }
.lvl-ok.tw { background: #8f5cff; color: #fff; }
.lvl-ok.gg { background: #fff; }
.lvl-ok svg { width: 0.7em; height: 0.7em; }
.profile-chip .pc-more { display: flex; align-items: center; gap: 0.45em; max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; transition: max-width .3s ease, opacity .2s, margin .3s; }
.profile-chip .pc-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 9em; text-align: left; line-height: 1.1; }
.profile-chip.open, .profile-chip:focus-visible { padding-right: 0.8em; }
.profile-chip.open .pc-more, .profile-chip:focus-visible .pc-more { max-width: 16em; opacity: 1; margin-left: 0.55em; }
@media (hover: hover) { .profile-chip:hover { padding-right: 0.8em; } .profile-chip:hover .pc-more { max-width: 16em; opacity: 1; margin-left: 0.55em; } }
.lvl { width: 2.2em; height: 2.2em; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; background: conic-gradient(var(--pet) calc(var(--p) * 1%), #2a241c 0); position: relative; flex: none; }
.lvl > span { position: relative; width: 1.75em; height: 1.75em; border-radius: 50%; display: grid; place-items: center; background: #120f0b; font-size: 0.8em; }
.menu-main { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 0.7em; padding: 0 1.2em 1.4em; }
.title-btn { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: var(--text); margin-bottom: 0.4em; }
.title-btn .h1 { font-size: 2.6em; font-family: 'Lobster', 'Unbounded', 'Arial Black', sans-serif; font-weight: 400; line-height: 1.05; transform: rotate(-3deg); transform-origin: left center; text-shadow: 0 3px 0 #000a, 0 0 14px #0008; }
.title-btn .h1 em { font-style: normal; color: #ff3d5e; text-shadow: 0 0 6px #ff3d5e, 0 0 22px #ff2a4dcc, 0 3px 0 #000a; animation: neonR 4s infinite; }
.title-btn .h1 b { color: #5ff7ff; text-shadow: 0 0 6px #5ff7ff, 0 0 22px #2ad8ffcc, 0 3px 0 #000a; font-weight: 400; animation: neonC 5s infinite; }
@keyframes neonC { 0%, 92%, 100% { opacity: 1; } 93% { opacity: .55; } 95% { opacity: 1; } 96% { opacity: .7; } }
/* ---- Главное меню по макету: шрифты Lobster (название) и Rubik, бронзовые кнопки на полупрозрачном тёмном ---- */
.screen.menu { font-family: 'Rubik', var(--f-body); }
.screen.menu .eyebrow { font-family: 'Rubik', var(--f-body); font-weight: 500; letter-spacing: 0.2em; color: #e2d6c2; font-size: 0.74em; text-shadow: 0 1px 2px #000c; }
.screen.menu .title-btn .h1 { font-family: 'Rubik', 'Arial Black', sans-serif; font-weight: 900; letter-spacing: -0.015em; filter: url(#brush); font-size: 3.05em; line-height: 1.02; transform: rotate(-3deg); color: #fbf0dc; text-shadow: 0 4px 0 #1b0f0a, 0 6px 16px #000d; }
.screen.menu .title-btn .h1 b { display: block; font-weight: 900; color: #3ff2ff; text-shadow: 0 0 4px #3ff2ffcc, 0 0 18px #20c8ffaa, 0 4px 0 #062a33; }
.screen.menu .title-btn .h1 em { font-weight: 900; color: #ff2d6a; text-shadow: 0 0 4px #ff2d6acc, 0 0 18px #ff1a50aa, 0 4px 0 #3a0614; }
.screen.menu .btn { font-family: 'Rubik', var(--f-body); font-weight: 600; color: #f6ecdc; background: linear-gradient(180deg, rgba(34,22,14,0.86), rgba(14,9,6,0.9)); border: 1px solid #7a5a32; border-radius: 0.65em; box-shadow: inset 0 1px 0 rgba(255,220,160,0.12), 0 4px 14px rgba(0,0,0,0.45); }
.screen.menu .btn:hover, .screen.menu .btn:focus-visible { border-color: #c9a35a; box-shadow: inset 0 1px 0 rgba(255,220,160,0.18), 0 0 16px rgba(201,163,90,0.35); }
.screen.menu .menu-grid .btn { font-size: 1.02em; min-height: 2.75em; padding: 0.55em 1em; }
.screen.menu .menu-main { gap: 0.55em; padding-bottom: 0.9em; }
.screen.menu .menu-grid { gap: 0.45em; }
.screen.menu .menu-grid .btn svg { width: 1.25em; height: 1.25em; }
.screen.menu .mode-btn { padding: 0.4em 0.4em 0.45em; font-size: 0.98em; gap: 0.05em; }
.screen.menu .mode-btn small { font-weight: 400; color: #bfb19b; font-size: 0.78em; }
.screen.menu .mode-art { border-radius: 0.45em; box-shadow: 0 0 0 1px rgba(255,220,160,0.18); margin-bottom: 0.35em; }
.screen.menu .mode-btn .ml svg { width: 1.2em; height: 1.2em; }
.screen.menu .collapse { background: rgba(14,9,6,0.85); border-color: #9a8b74; color: #f6ecdc; }
.screen.menu .btn.brass { background: linear-gradient(180deg, #5a3410, #2e1806); color: #ffd98a; border: 2px solid #f0b850; box-shadow: 0 0 18px #ff9a2a88, inset 0 0 14px #ffb84a44, inset 0 1px 0 #ffe0a066; text-shadow: 0 0 10px #ffb84a99; font-size: 1.35em !important; font-weight: 700; }
.screen.menu .btn.brass svg { color: #ffc048; filter: drop-shadow(0 0 6px #ffb84acc); width: 1.1em; height: 1.1em; }
.screen.menu .btn.brass:hover { box-shadow: 0 0 26px #ff9a2acc, inset 0 0 18px #ffb84a66; }
.screen.menu .foot { color: #8d7f6b; }
@media (prefers-reduced-motion: reduce) { .title-btn .h1 b, .title-btn .h1 em { animation: none; } }
@keyframes neonR { 0%, 60%, 100% { opacity: 1; } 61% { opacity: .6; } 62% { opacity: 1; } }
.title-btn.wiggle { animation: wig .25s; }
@keyframes wig { 30% { transform: rotate(-1.2deg) } 70% { transform: rotate(1.2deg) } }
.play-modes { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s; }
.play-modes.open { grid-template-rows: 1fr; }
.play-modes > div { overflow: hidden; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5em; }
.mode-btn { flex-direction: column; gap: 0.15em; padding: 0.7em 0.3em; }
.mode-btn small { font-weight: 600; color: var(--mute); font-size: 0.75em; }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5em; }
.badge { min-width: 1.4em; height: 1.4em; border-radius: 1em; background: var(--blood); color: #fff; font-size: 0.72em; display: inline-grid; place-items: center; padding: 0 0.35em; }
.foot { position: relative; text-align: center; font-size: 0.7em; color: #6f6455; padding-bottom: 0.8em; }

/* Секрет */
.secret { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(circle, #1a0003, #000 70%); animation: fadein .4s; text-align: center; padding: 2em; }
.secret .eye { width: 60%; aspect-ratio: 2; margin: 0 auto 1.2em; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #000 13%, #ff2a3d 14%, #7a0010 32%, #f2efe6 34%, #d9d2c0 60%); animation: open 1.6s ease-out forwards; transform: scaleY(0.02); box-shadow: 0 0 60px #ff2a3d66; }
@keyframes open { 40% { transform: scaleY(0.02) } 70% { transform: scaleY(1.05) } 100% { transform: scaleY(1) } }
@keyframes fadein { from { opacity: 0 } }

/* Карточки выбора */
.pick { display: flex; gap: 0.7em; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 0.6em 0.7em; cursor: pointer; width: 100%; }
.pick.on { border-color: var(--brass); background: #221b12; box-shadow: 0 0 0 1px var(--brass) inset; }
.pick[disabled] { opacity: .5; cursor: not-allowed; }
.swatch { width: 2.6em; height: 2.6em; border-radius: 0.35em; flex: none; display: grid; grid-template-rows: 2fr 1fr 1fr; overflow: hidden; border: 1px solid #00000080; }
.stars { color: var(--brass); letter-spacing: 0.1em; font-size: 0.8em; }
.diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45em; }
.diff { flex-direction: column; align-items: flex-start; gap: 0.1em; }
.diff .num { font-size: 0.8em; color: var(--mute); }
.hero-thumb { width: 2.8em; height: 2.8em; border-radius: 0.4em; background: #0f0d0a center/cover no-repeat; flex: none; border: 1px solid var(--line); }

/* Игровой экран */
.game { background: #000; }
.hud { padding: 0.5em 0.7em 0.45em; background: linear-gradient(#15110d, #0f0c09); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 0.4em; z-index: 2; }
.hud-row { display: flex; align-items: center; gap: 0.5em; min-width: 0; }
.notice { position: relative; flex: 1; min-width: 0; height: calc(2.6em / 0.74); display: flex; flex-direction: column; justify-content: center; padding: 0 0.6em; border-radius: 0.5em; background: #0b0a09; border: 1px solid #2a2622; overflow: hidden; font-size: 0.74em; line-height: 1.18; }
.notice > [hidden] { display: none !important; }
.nt-idle { color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nt-idle b { color: var(--text); }
.nt-msg { color: #dfe; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nt-msg b { color: var(--brass-hi); }
