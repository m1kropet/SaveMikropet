# Cloudflare Workers: npx wrangler deploy
name = "savemikropet"
main = "worker/worker.js"
compatibility_date = "2025-01-01"
# не стирать переменные, заданные в панели Cloudflare (TWITCH_CLIENT_ID, GOOGLE_CLIENT_ID), при каждом деплое
keep_vars = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "HUB"
class_name = "GameHub"

# SQLite-класс Durable Object доступен на бесплатном тарифе
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameHub"]

# Client ID входа (не секрет: они видны в адресе при входе)
[vars]
TWITCH_CLIENT_ID = "emi37q21jetu9wwmf02ilryig66nug"
GOOGLE_CLIENT_ID = "1087888432747-og7avctdmps9ttqk7b16da3lffr0j84m.apps.googleusercontent.com"
