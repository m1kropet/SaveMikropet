<title>Защити микропета от ковтопа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Отель после закрытия: латунные таблички номеров, выцветший обой, мятный свет микропета.
   Вертикальный кадр 9:16 по центру; сверху HUD, по центру 3D-сцена, снизу док. */
:root {
  --ink: #0b0a09; --panel: #15120e; --panel2: #1e1913; --line: #3a3024;
  --brass: #c9a35a; --brass-hi: #ecd18f; --pet: #5fffd8; --blood: #e0445a;
  --text: #efe6d2; --mute: #9b8f7a; --good: #7ee08a; --warn: #ffb347;
  --f-display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --f-body: 'Manrope', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
  --r: 0.5em;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: #050404; color: var(--text); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--pet); outline-offset: 2px; }

#app { position: relative; height: 100%; display: grid; place-items: center; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.frame {
  position: relative; overflow: hidden;
  width: min(100%, calc((100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 9 / 16));
  height: min(100%, calc(100vw * 16 / 9));
  aspect-ratio: 9 / 16;
  background: var(--ink);
  font-size: var(--fs, 15px);
  display: flex; flex-direction: column;
  box-shadow: 0 0 0 1px #221c15, 0 30px 80px #000;
}
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.scroll { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; padding: 0.9em 1em 1.4em; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

/* Таблички и кнопки */
.btn {
  appearance: none; border: 1px solid var(--line); background: linear-gradient(#251f17, #19150f);
  border-radius: var(--r); padding: 0.75em 1em; min-height: 2.9em; cursor: pointer;
  font-weight: 700; letter-spacing: 0.01em; display: inline-flex; align-items: center; justify-content: center; gap: 0.5em;
  transition: border-color .15s, transform .08s, box-shadow .15s, background .15s;
}
.btn:hover { border-color: var(--brass); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.brass { background: linear-gradient(#e2c27a, #b48a3f); color: #1a1208; border-color: #f2dc9f; box-shadow: inset 0 1px 0 #fff3c8, 0 0 0 1px #6a4f22; }
.btn.brass:hover { box-shadow: inset 0 1px 0 #fff3c8, 0 0 18px #c9a35a66; }
.btn.pet { background: linear-gradient(#2b4a43, #18302b); border-color: #3e8f7c; color: #d9fff4; }
.btn.danger { border-color: #6e2a33; color: #ffb7c0; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 2.3em; padding: 0.4em 0.7em; font-size: 0.86em; }
.btn.block { width: 100%; }
.icon-btn { width: 2.6em; height: 2.6em; min-height: 0; padding: 0; }

.plaque { font-family: var(--f-mono); font-weight: 700; background: linear-gradient(#d9b86c, #a8823c); color: #1c1309; border-radius: 0.3em; padding: 0.15em 0.5em; box-shadow: inset 0 1px 0 #fff0c0, 0 1px 0 #00000080; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.72em; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
.h1 { font-family: var(--f-display); font-weight: 900; line-height: 1.02; text-wrap: balance; margin: 0; }
.h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.15em; margin: 0; text-wrap: balance; }
.mute { color: var(--mute); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.coin::before { content: ''; display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff1b0, #ffc53d 45%, #b97a00); margin-right: 0.3em; vertical-align: -0.05em; box-shadow: 0 0 0 1px #6a4500; }
.mcoin::before { background: radial-gradient(circle at 35% 35%, #f0fff9, #5fffd8 45%, #1d8f74); box-shadow: 0 0 0 1px #0d4a3c; }

.topbar { display: flex; align-items: center; gap: 0.6em; padding: 0.7em 1em; border-bottom: 1px solid var(--line); background: linear-gradient(#17130f, #110e0b); }
.topbar .h2 { flex: 1; min-width: 0; }
.section { display: flex; flex-direction: column; gap: 0.55em; margin-top: 1.1em; }
.section:first-child { margin-top: 0; }
.card { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 0.75em 0.85em; }
.list { display: flex; flex-direction: column; gap: 0.45em; }
.row { display: flex; align-items: center; gap: 0.6em; min-width: 0; }
.row > .grow, .grow { flex: 1; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4em; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 0.25em 0.7em; font-size: 0.85em; background: var(--panel2); cursor: pointer; display: inline-flex; align-items: center; gap: 0.35em; }
.chip.on { border-color: var(--pet); color: var(--pet); background: #12302a; }
.tag { font-size: 0.7em; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.15em 0.5em; border-radius: 0.3em; border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
.tag.demo { border-color: #7a5c2a; color: var(--brass-hi); background: #2a2013; }
.tag.lock { border-color: #5a2a33; color: #ff9aa8; }
.note { font-size: 0.82em; color: var(--mute); line-height: 1.45; }
.banner { border: 1px dashed #7a5c2a; background: #1f180f; color: var(--brass-hi); border-radius: var(--r); padding: 0.6em 0.8em; font-size: 0.82em; line-height: 1.45; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 0.55em 0.3em; cursor: pointer; font-weight: 700; font-size: 0.88em; color: var(--mute); }
.seg button.on { background: #2a2216; color: var(--brass-hi); }
.bar { height: 0.45em; border-radius: 1em; background: #2a241c; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--pet), #b7fff0); border-radius: inherit; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: 0.6em 0; border-bottom: 1px solid #241e17; }
.switch { width: 3em; height: 1.7em; border-radius: 1em; background: #2a241c; border: 1px solid var(--line); position: relative; cursor: pointer; flex: none; }
.switch::after { content: ''; position: absolute; top: 0.15em; left: 0.15em; width: 1.3em; height: 1.3em; border-radius: 50%; background: var(--mute); transition: left .15s, background .15s; }
.switch[aria-checked="true"] { background: #17392f; border-color: #3e8f7c; }
.switch[aria-checked="true"]::after { left: 1.5em; background: var(--pet); }
input[type=text] { width: 100%; min-width: 0; background: #0f0d0a; border: 1px solid var(--line); color: var(--text); border-radius: var(--r); padding: 0.65em 0.75em; font: inherit; }
.err { color: #ff9aa8; font-size: 0.82em; min-height: 1.2em; }

/* Главное меню */
.menu-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  background:
    radial-gradient(60% 35% at 50% 8%, #ffcf8a22, transparent 70%),
    radial-gradient(40% 25% at 50% 92%, #5fffd81a, transparent 70%),
    repeating-linear-gradient(90deg, #15201a 0 3.2em, #121a15 3.2em 6.4em);
}

.door { position: absolute; left: 50%; top: 31%; width: 34%; aspect-ratio: 0.52; transform: translateX(-50%); background: linear-gradient(#2c1a10, #1b0f08); border: 0.35em solid #120a05; border-radius: 0.3em 0.3em 0 0; box-shadow: 0 0 60px #ff2a3d22 inset, 0 0 0 0.25em #3a2214; }
.door::before { content: '0000'; position: absolute; top: 9%; left: 50%; transform: translateX(-50%); font-family: var(--f-mono); font-weight: 700; font-size: 0.9em; background: linear-gradient(#d9b86c, #a8823c); color: #1c1309; padding: 0.1em 0.5em; border-radius: 0.2em; }
.door::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4%; background: #ff2a3d; filter: blur(6px); opacity: .55; animation: underdoor 4s infinite; }
@keyframes underdoor { 0%, 100% { opacity: .35 } 45% { opacity: .7 } 50% { opacity: .1 } 55% { opacity: .6 } }
.lamp { position: absolute; top: 0; left: 50%; width: 0.3em; height: 12%; background: #1a140e; transform: translateX(-50%); }
.lamp::after { content: ''; position: absolute; bottom: -0.6em; left: 50%; transform: translateX(-50%); width: 1.2em; height: 1.2em; border-radius: 50%; background: #ffd28a; box-shadow: 0 0 40px 16px #ffb05a55; animation: flicker 5s infinite; }
@keyframes flicker { 0%, 100% { opacity: 1 } 92% { opacity: 1 } 93% { opacity: .2 } 94% { opacity: 1 } 96% { opacity: .4 } 97% { opacity: 1 } }
.peek { position: absolute; top: 46%; left: 10%; width: 3.4em; height: 2.6em; border-radius: 50% 50% 40% 40%; background: radial-gradient(circle at 50% 30%, #c8fff0, #5fffd8 60%, #2fb093); box-shadow: 0 0 30px #5fffd855; animation: bob 2.6s ease-in-out infinite; }
.peek::before, .peek::after { content: ''; position: absolute; top: 38%; width: 0.45em; height: 0.55em; border-radius: 50%; background: #0a0d12; box-shadow: inset 0.1em -0.1em 0 #ffffffaa; }
.peek::before { left: 30%; } .peek::after { right: 30%; }
@keyframes bob { 50% { transform: translateY(-0.3em) } }
.menu-top { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 0.9em 1em 0; gap: 0.6em; }
.profile-chip { display: flex; align-items: center; gap: 0.55em; background: #120f0bcc; border: 1px solid var(--line); border-radius: 999px; padding: 0.3em 0.8em 0.3em 0.3em; cursor: pointer; min-width: 0; }
.lvl { width: 2.2em; height: 2.2em; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; background: conic-gradient(var(--pet) calc(var(--p) * 1%), #2a241c 0); position: relative; flex: none; }
.lvl > span { position: relative; width: 1.75em; height: 1.75em; border-radius: 50%; display: grid; place-items: center; background: #120f0b; font-size: 0.8em; }
.menu-main { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 0.7em; padding: 0 1.2em 1.4em; }
.title-btn { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: var(--text); margin-bottom: 0.4em; }
.title-btn .h1 { font-size: 2.35em; }
.title-btn .h1 em { font-style: normal; color: var(--blood); text-shadow: 0 0 18px #e0445a55; }
.title-btn .h1 b { color: var(--pet); text-shadow: 0 0 18px #5fffd855; font-weight: 900; }
.title-btn.wiggle { animation: wig .25s; }
@keyframes wig { 30% { transform: rotate(-1.2deg) } 70% { transform: rotate(1.2deg) } }
.play-modes { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s; }
.play-modes.open { grid-template-rows: 1fr; }
.play-modes > div { overflow: hidden; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5em; }
.mode-btn { flex-direction: column; gap: 0.15em; padding: 0.7em 0.3em; }
.mode-btn small { font-weight: 600; color: var(--mute); font-size: 0.75em; }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5em; }
.badge { min-width: 1.4em; height: 1.4em; border-radius: 1em; background: var(--blood); color: #fff; font-size: 0.72em; display: inline-grid; place-items: center; padding: 0 0.35em; }
.foot { position: relative; text-align: center; font-size: 0.7em; color: #6f6455; padding-bottom: 0.8em; }

/* Секрет */
.secret { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(circle, #1a0003, #000 70%); animation: fadein .4s; text-align: center; padding: 2em; }
.secret .eye { width: 60%; aspect-ratio: 2; margin: 0 auto 1.2em; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #000 13%, #ff2a3d 14%, #7a0010 32%, #f2efe6 34%, #d9d2c0 60%); animation: open 1.6s ease-out forwards; transform: scaleY(0.02); box-shadow: 0 0 60px #ff2a3d66; }
@keyframes open { 40% { transform: scaleY(0.02) } 70% { transform: scaleY(1.05) } 100% { transform: scaleY(1) } }
@keyframes fadein { from { opacity: 0 } }

/* Карточки выбора */
.pick { display: flex; gap: 0.7em; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 0.6em 0.7em; cursor: pointer; width: 100%; }
.pick.on { border-color: var(--brass); background: #221b12; box-shadow: 0 0 0 1px var(--brass) inset; }
.pick[disabled] { opacity: .5; cursor: not-allowed; }
.swatch { width: 2.6em; height: 2.6em; border-radius: 0.35em; flex: none; display: grid; grid-template-rows: 2fr 1fr 1fr; overflow: hidden; border: 1px solid #00000080; }
.stars { color: var(--brass); letter-spacing: 0.1em; font-size: 0.8em; }
.diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45em; }
.diff { flex-direction: column; align-items: flex-start; gap: 0.1em; }
.diff .num { font-size: 0.8em; color: var(--mute); }
.hero-thumb { width: 2.8em; height: 2.8em; border-radius: 0.4em; background: #0f0d0a center/cover no-repeat; flex: none; border: 1px solid var(--line); }

/* Игровой экран */
.game { background: #000; }
.hud { padding: 0.5em 0.7em 0.45em; background: linear-gradient(#15110d, #0f0c09); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 0.4em; z-index: 2; }
.hud-row { display: flex; align-items: center; gap: 0.5em; min-width: 0; }
.hud-title { flex: 1; min-width: 0; font-size: 0.78em; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-title b { color: var(--text); }
.stats3 { display: grid; grid-template-columns: 1.15fr 1.4fr 1fr; gap: 0.45em; }
.stat { background: #0d0b08; border: 1px solid var(--line); border-radius: 0.4em; padding: 0.3em 0.5em; min-width: 0; }
.stat .eyebrow { font-size: 0.62em; }
.stat .v { font-family: var(--f-mono); font-weight: 700; font-size: 1.05em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hp .bar > i { background: linear-gradient(90deg, #ff6b81, #ffd0d8); }
.hp.low .v { color: #ff8a9a; animation: pulse 0.8s infinite; }
@keyframes pulse { 50% { opacity: .5 } }
.stage { position: relative; flex: 1; min-height: 0; background: #000; touch-action: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 55%, transparent 55%, #000000b0 100%); }
.announce, .hint { z-index: 2; }
.announce { position: absolute; left: 50%; top: 2.4em; transform: translateX(-50%); pointer-events: none; text-align: center; transition: opacity .3s, transform .3s; opacity: 0; white-space: nowrap; }
.announce.show { opacity: 1; transform: translateX(-50%) translateY(0.2em); }
.announce .h2 { font-size: 1.2em; text-shadow: 0 2px 10px #000; }
.announce.boss .h2 { color: #ff6b7d; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); top: 0.5em; width: max-content; max-width: calc(100% - 1.2em); pointer-events: none; text-align: center; font-size: 0.78em; color: #dfe; background: #0b0a09cc; border: 1px solid #2a3a34; border-radius: 0.5em; padding: 0.35em 0.7em; }
.hint:empty { display: none; }
.opp { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.5em; align-items: center; font-size: 0.82em; }
.opp .side { background: #0d0b08; border: 1px solid var(--line); border-radius: 0.4em; padding: 0.3em 0.5em; min-width: 0; }
.opp .side.bot { border-color: #5a2a33; }
.opp .timer { font-family: var(--f-mono); font-weight: 700; font-size: 1.1em; text-align: center; }
.opp .st { color: var(--mute); font-size: 0.85em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.players { display: flex; gap: 0.35em; flex-wrap: wrap; }
.pchip { display: inline-flex; align-items: center; gap: 0.35em; padding: 0.25em 0.6em; border-radius: 999px; border: 1px solid var(--line); font-size: 0.8em; cursor: pointer; background: #0d0b08; }
.pchip i { width: 0.7em; height: 0.7em; border-radius: 50%; display: inline-block; }
.pchip.on { border-color: currentColor; box-shadow: 0 0 0 1px currentColor inset; }

.dock { border-top: 1px solid var(--line); background: linear-gradient(#14100c, #0d0a08); padding: 0.5em 0.6em 0.6em; display: flex; flex-direction: column; gap: 0.45em; z-index: 2; flex: none; height: var(--dock-h, 15.6em); overflow: hidden; }
.dock > .build { flex: 1; min-height: 0; }
.dock > .ctrl { margin-top: auto; }
.build { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4em; }
.hbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3em; padding: 0.4em 0.2em 0.35em; border-radius: 0.5em; border: 1px solid var(--line); background: #17130e; cursor: pointer; min-width: 0; }
.hbtn .hero-thumb { width: 3.6em; height: 3.6em; }
.hbtn .nm { font-size: 0.72em !important; }
.hbtn .nm { font-size: 0.66em; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.hbtn.on { border-color: var(--pet); background: #12302a; }
.hbtn.poor { opacity: .5; }
.hbtn.empty { visibility: hidden; }
.ctrl { display: grid; grid-template-columns: 1fr auto auto; gap: 0.4em; }
.panel { overflow-y: auto; min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 0.5em; scrollbar-width: thin; }
.panel > *, .dock > *, .hud > * { flex-shrink: 0; }
.ph { display: flex; align-items: center; gap: 0.55em; }
.statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.3em; }
.statgrid div { background: #0d0b08; border: 1px solid #2a231a; border-radius: 0.35em; padding: 0.2em 0.35em; min-width: 0; }
.statgrid span { display: block; font-size: 0.6em; color: var(--mute); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.statgrid b { font-family: var(--f-mono); font-size: 0.86em; }
.statgrid .up { color: var(--good); }
.branch { display: grid; grid-template-columns: 4.6em repeat(5, 1fr); gap: 0.25em; align-items: stretch; }
.branch .lbl { font-size: 0.62em; color: var(--mute); line-height: 1.2; display: flex; flex-direction: column; justify-content: center; text-transform: uppercase; letter-spacing: 0.05em; }
.branch .lbl b { color: var(--text); font-size: 1.2em; letter-spacing: 0; text-transform: none; }
.tier { border: 1px solid var(--line); background: #15110d; border-radius: 0.4em; padding: 0.25em 0.1em; display: flex; flex-direction: column; align-items: center; gap: 0.1em; cursor: pointer; min-width: 0; position: relative; }
.tier svg { width: 1.3em; height: 1.3em; }
.tier .c { font-family: var(--f-mono); font-size: 0.62em; }
.tier.owned { border-color: #6a5326; background: #2a2010; color: var(--brass-hi); }
.tier.owned.b1 { border-color: #6e2a33; background: #2a1013; color: #ffb7c0; }
.tier.next { border-color: #3e8f7c; }
.tier.can { border-color: #6bffd8; background: linear-gradient(#1f5a4b, #143a31); color: #dffff6; box-shadow: 0 0 0 1px #6bffd855 inset, 0 0 10px #5fffd855; animation: canpulse 1.6s ease-in-out infinite; }
.tier.can .c { color: #b6fff0; font-weight: 700; }
@keyframes canpulse { 50% { box-shadow: 0 0 0 1px #6bffd899 inset, 0 0 16px #5fffd8aa; } }
.opp .timer small { display: block; font-size: 0.62em; color: var(--pet); font-weight: 600; white-space: nowrap; }
.tier.locked { opacity: .35; }
.tier.sel { outline: 2px solid #ffffff; outline-offset: 1px; }
.tier .lock { position: absolute; top: -0.35em; right: -0.25em; font-size: 0.65em; background: #3a1418; color: #ffb7c0; border-radius: 0.3em; padding: 0 0.25em; }
.detail .tag { white-space: normal; display: inline-flex; align-items: center; gap: .3em; text-transform: none; letter-spacing: 0; font-size: .78em; }
.detail { border: 1px solid var(--line); background: #110e0b; border-radius: 0.5em; padding: 0.55em 0.65em; display: flex; flex-direction: column; gap: 0.35em; }
.diffs { display: flex; flex-wrap: wrap; gap: 0.25em 0.8em; font-family: var(--f-mono); font-size: 0.78em; }
.diffs .up { color: var(--good); } .diffs .dn { color: #ff9aa8; }
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 0.35em; }

/* Магазин */
.showcase { position: relative; height: 30%; min-height: 9em; flex: none; background: radial-gradient(60% 70% at 50% 60%, #2a1f3a, #0b0a09 70%); border-bottom: 1px solid var(--line); }
.showcase canvas { width: 100%; height: 100%; display: block; }
.showcase .cap { position: absolute; left: 0; bottom: 0; right: 0; padding: 1.6em 1em 0.7em; background: linear-gradient(transparent, #0b0a09e6 60%); display: flex; align-items: flex-end; gap: 0.6em; pointer-events: none; }
.rar { font-size: 0.7em; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 800; }
.hero-card { display: flex; gap: 0.7em; align-items: center; border: 1px solid var(--line); background: linear-gradient(#1a1510, #120e0b); border-radius: 0.6em; padding: 0.55em; cursor: pointer; text-align: left; width: 100%; }
.hero-card.on { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass) inset, 0 0 18px #c9a35a22; }
.hero-card .hero-thumb { width: 3.6em; height: 3.6em; }
.hero-card.locked .hero-thumb { filter: grayscale(.8) brightness(.6); }
.cmp { display: grid; grid-template-columns: auto 1fr auto; gap: 0.25em 0.6em; align-items: center; font-size: 0.82em; }
.cmp .bar { height: 0.4em; }
.blist { display: flex; flex-direction: column; gap: 0.3em; }
.blist .it { display: flex; gap: 0.5em; align-items: flex-start; font-size: 0.82em; }
.blist .it .num { color: var(--brass-hi); min-width: 3.4em; text-align: right; }

/* Модальные окна и уведомления */
.modal { position: absolute; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: #000a; animation: fadein .15s; padding: 1em; }
.modal .sheet { width: 100%; max-height: 92%; overflow-y: auto; background: linear-gradient(#1c1712, #120f0b); border: 1px solid var(--line); border-radius: 0.8em; padding: 1em; display: flex; flex-direction: column; gap: 0.75em; box-shadow: 0 -10px 50px #000; }
.modal.center { align-items: center; }
.result-title { font-family: var(--f-display); font-weight: 900; font-size: 2em; text-align: center; }
.result-title.win { color: var(--pet); } .result-title.lose { color: var(--blood); } .result-title.draw { color: var(--brass-hi); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 0.35em 1em; font-size: 0.92em; }
.kv b { font-family: var(--f-mono); text-align: right; }
.toasts { position: absolute; left: 0.8em; right: 0.8em; top: 0.8em; z-index: 60; display: flex; flex-direction: column; gap: 0.35em; pointer-events: none; align-items: center; }
.toast { background: #1d1813f2; border: 1px solid var(--line); border-radius: 0.5em; padding: 0.5em 0.8em; font-size: 0.85em; box-shadow: 0 6px 24px #000a; animation: tin .2s; max-width: 100%; }
.toast.good { border-color: #3e8f7c; } .toast.bad { border-color: #6e2a33; } .toast.gold { border-color: var(--brass); }
@keyframes tin { from { transform: translateY(-0.5em); opacity: 0 } }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.3em; }
.tabs button { font-size: 0.75em; padding: 0.5em 0.2em; }
.lb-row { display: grid; grid-template-columns: 2em 1fr auto; gap: 0.6em; align-items: center; padding: 0.5em 0.6em; border: 1px solid var(--line); border-radius: 0.45em; background: var(--panel); cursor: pointer; width: 100%; text-align: left; }
.lb-row.me { border-color: var(--pet); background: #10261f; }
.dot { width: 0.55em; height: 0.55em; border-radius: 50%; display: inline-block; background: #555; }
.dot.on { background: var(--good); }
.ach { display: flex; gap: 0.6em; align-items: center; padding: 0.45em 0; border-bottom: 1px solid #241e17; }
.ach .medal { width: 2em; height: 2em; border-radius: 50%; flex: none; display: grid; place-items: center; background: #221c15; border: 1px solid var(--line); }
.ach.got .medal { background: radial-gradient(circle at 35% 35%, #fff1b0, #c9a35a 60%, #7a5a20); border-color: #f2dc9f; }

/* Компактная панель прокачки и новые элементы */
.btn.mini { min-height: 2.1em; padding: 0.25em 0.55em; font-size: 0.78em; border-radius: 0.4em; gap: 0.3em; }
.btn.mini svg { width: 1em; height: 1em; }
.btn.tw { background: linear-gradient(#8f5cff, #6a3ad6); border-color: #b393ff; color: #fff; }
.tw-badge { display: inline-grid; place-items: center; width: 1.15em; height: 1.15em; border-radius: 50%; background: #8f5cff; color: #fff; vertical-align: -0.15em; }
.tw-badge svg { width: 0.8em; height: 0.8em; }
.tw-ava { width: 2.4em; height: 2.4em; border-radius: 50%; display: grid; place-items: center; background: #2a1d4a; color: #c9b3ff; flex: none; object-fit: cover; }
.panel.compact { gap: 0.35em; }
.panel.compact .ph .hero-thumb { width: 2.1em; height: 2.1em; }
.chipline { display: flex; flex-wrap: wrap; gap: 0.15em 0.6em; font-family: var(--f-mono); font-size: 0.7em; color: var(--text); }
.chipline i { font-style: normal; color: var(--mute); font-family: var(--f-body); }
.tools { display: flex; flex-wrap: wrap; gap: 0.3em; }
.tools .ghost { margin-left: auto; }
.panel.compact .branch { grid-template-columns: 2.6em repeat(5, 1fr); gap: 0.2em; }
.panel.compact .branch .lbl { font-size: 0.66em; flex-direction: row; align-items: center; gap: 0.2em; color: var(--text); text-transform: none; letter-spacing: 0; }
.panel.compact .branch .lbl svg { width: 0.9em; height: 0.9em; color: #ff9aa8; }
.panel.compact .tier { flex-direction: row; justify-content: center; gap: 0.2em; padding: 0.22em 0.1em; min-height: 1.9em; }
.panel.compact .tier svg { width: 1em; height: 1em; }
.panel.compact .tier .c { font-size: 0.6em; }
.panel.compact .detail { padding: 0.4em 0.55em; gap: 0.2em; font-size: 0.92em; }
.panel.compact .detail .note { font-size: 0.78em; }
.small-note { font-size: 0.74em; }
.opp-list { display: flex; flex-direction: column; gap: 0.25em; max-height: 9em; overflow-y: auto; }
.opp-t { display: grid; grid-template-columns: 1.8em 1fr auto; gap: 0.5em; align-items: center; border: 1px solid var(--line); background: #15110d; border-radius: 0.4em; padding: 0.25em 0.45em; cursor: pointer; text-align: left; font-size: 0.85em; }
.opp-t .hero-thumb { width: 1.8em; height: 1.8em; }
.viewing { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; text-align: center; padding: 0.35em; font-size: 0.78em; font-weight: 700; color: #ffd0d6; background: linear-gradient(transparent, #4a0a14cc); pointer-events: none; }
.mapthumb { width: 2.7em; height: 4.5em; border-radius: 0.3em; object-fit: cover; flex: none; border: 1px solid #00000080; background: #111; }
.mode-art { width: 100%; aspect-ratio: 2 / 1; object-fit: cover; border-radius: 0.35em; margin-bottom: 0.25em; display: block; }
.menu-bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.pub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.45em; }
.pub-card { display: flex; flex-direction: column; align-items: center; gap: 0.35em; padding: 0.7em 0.3em; border: 1px solid var(--line); border-radius: var(--r); background: linear-gradient(#251f17, #19150f); cursor: pointer; text-align: center; min-width: 0; }
.pub-card:hover { border-color: var(--pet); }
.pub-card .note { font-size: 0.7em; }
.pub-dots { display: flex; gap: 0.25em; justify-content: center; }
.pub-dots i { width: 0.7em; height: 0.7em; border-radius: 50%; border: 1px solid #3e8f7c; background: transparent; }
.pub-dots i.on { background: var(--pet); box-shadow: 0 0 8px #5fffd888; }
.pub-dots.big i { width: 1em; height: 1em; }
.countdown { display: flex; flex-direction: column; align-items: center; gap: 0.5em; text-align: center; }
.countdown.go { border-color: var(--pet); background: #10261f; }
.countdown.go b { color: var(--pet); }
/* Теги, свернуть, голосование, код */
.ptag { font-family: var(--f-mono); font-size: 0.78em; color: var(--brass-hi); font-weight: 700; letter-spacing: 0.04em; }
.title-row { position: relative; }
.title-row .title-btn { display: block; width: 100%; }
.title-row .collapse { position: absolute; right: 0; top: -0.55em; min-height: 2.1em; padding: 0 0.8em; }
.shop-tabs { margin: 0.6em 1.2em 0; }
.skin-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6em; margin-top: 0.5em; }
.skin-card { display: flex; flex-direction: column; gap: 0.4em; padding: 0.45em; border-radius: 0.6em; background: var(--panel, #161210); border: 1px solid var(--line, #3a2c20); color: var(--text); cursor: pointer; text-align: left; font: inherit; }
.skin-card.sel { border-color: var(--brass-hi); box-shadow: 0 0 0 1px var(--brass-hi) inset; }
.skin-prev { position: relative; display: block; aspect-ratio: 4 / 5; border-radius: 0.4em; background-size: cover; background-position: center; }
.skin-card.locked .skin-prev { filter: grayscale(0.85) brightness(0.45); }
.skin-lock { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.8em; color: var(--text); }
.skin-meta { display: flex; justify-content: space-between; align-items: center; gap: 0.4em; }
.tag.on { color: var(--pet); border-color: #3e8f7c; }
.vote-grid .diff { gap: 0.25em; }
.vote-bar { display: flex; gap: 0.2em; }
.vote-bar i { width: 0.6em; height: 0.6em; border-radius: 50%; border: 1px solid #3e8f7c; }
.vote-bar i.on { background: var(--pet); }
.code-box input { text-transform: uppercase; font-family: var(--f-mono); letter-spacing: 0.1em; }
.pchip .pcoins { font-size: 0.85em; opacity: 0.85; }
.pchip .pcoins::before { content: '· '; }

/* Оформление «Шахты»: камень, крепь, медь и свет фонарей */
.frame.theme-mine { --ink: #120d09; --panel: #1d1610; --panel2: #271d14; --line: #4a3524; --brass: #d9822b; --brass-hi: #ffb15c; --text: #f4e4cc; --mute: #a8916f; }
.theme-mine .btn { background: linear-gradient(#2c2117, #1c150e); }
